pages:
  stage: report
  image: frankescobar/allure-docker-service
  script:
    - allure generate allure-results -o public --clean
    - echo "============================================================="
    - echo "ALLURE REPORT IS READY! View in here:"
    - echo "$CI_PAGES_URL"
    - echo "============================================================="
  artifacts:
    paths:
      - public/
  when: always